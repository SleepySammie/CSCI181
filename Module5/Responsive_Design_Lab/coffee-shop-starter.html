<!DOCTYPE html>
<html>
<head>
  <title>Daily Grind Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="stylesheet" href="styles-final.css">
</head>
<body>

  <h1>The Daily Grind</h1>
  <p class="tagline">Coffee, pastries, and a place to sit a while.</p>

  <div class="menu">

    <div class="card">
      <h2>Espresso</h2>
      <p>A bold, concentrated shot pulled fresh for every order.</p>
      <p class="price">$3.00</p>
      <button class="order-btn">Add to Order</button>
    </div>

    <div class="card">
      <h2>Latte</h2>
      <p>Espresso balanced with steamed milk and a thin layer of foam.</p>
      <p class="price">$4.50</p>
      <button class="order-btn">Add to Order</button>
    </div>

    <div class="card">
      <h2>Cold Brew</h2>
      <p>Slow-steeped for 18 hours, served over ice.</p>
      <p class="price">$5.00</p>
      <button class="order-btn">Add to Order</button>
    </div>

  </div>

</body>
</html>
